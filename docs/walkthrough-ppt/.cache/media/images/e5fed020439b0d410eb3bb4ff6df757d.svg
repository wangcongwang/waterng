<svg width="1132" height="212" viewBox="0 0 1132 212" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="26" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#202259" stroke-width="2" /><text x="95" y="52" fill="#202259" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">Recharge 充值</text><text x="95" y="74" fill="#5C646A" font-size="14" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">现金充值入口</text><line x1="190" y1="58" x2="242" y2="58" stroke="#2AA7CF" stroke-width="3" /><polygon points="242,50 256,58 242,66" fill="#2AA7CF" /><rect x="256" y="26" width="200" height="64" rx="8" fill="#202259" /><text x="356" y="52" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">Member Bonus</text><text x="356" y="74" fill="#7FD3EC" font-size="14" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">BV 台账</text><line x1="456" y1="58" x2="508" y2="58" stroke="#2AA7CF" stroke-width="3" /><polygon points="508,50 522,58 508,66" fill="#2AA7CF" /><text x="466" y="46" fill="#B3528A" font-size="13" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">Bonus To Ecoin</text><rect x="522" y="26" width="200" height="64" rx="8" fill="#202259" /><text x="622" y="52" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">Member Ecoin</text><text x="622" y="74" fill="#7FD3EC" font-size="14" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">EC 台账</text><line x1="722" y1="58" x2="774" y2="58" stroke="#2AA7CF" stroke-width="3" /><polygon points="774,50 788,58 774,66" fill="#2AA7CF" /><rect x="788" y="26" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#202259" stroke-width="2" /><text x="888" y="52" fill="#202259" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">结算页余额支付</text><text x="888" y="74" fill="#5C646A" font-size="14" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">当场扣减并置为 Paid</text><rect x="522" y="140" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#F287B7" stroke-width="2" /><text x="622" y="165" fill="#B3528A" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">其他会员的 Ecoin</text><text x="622" y="186" fill="#5C646A" font-size="14" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">按会员编码定向转出</text><line x1="622" y1="90" x2="622" y2="140" stroke="#F287B7" stroke-width="3" /><polygon points="614,140 622,154 630,140" fill="#F287B7" /><text x="636" y="118" fill="#B3528A" font-size="13" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">Ecoin To Ecoin</text><text x="0" y="166" fill="#5C646A" font-size="14" font-family="Inter, PingFang SC, sans-serif">每一次充值、转账都会在两本台账各自留下一条带时间、金额与备注的流水，</text><text x="0" y="188" fill="#5C646A" font-size="14" font-family="Inter, PingFang SC, sans-serif">账户页的 View History 就是把这些流水按时间正序渲染成表格。</text></svg>