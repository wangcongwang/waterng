<svg width="668" height="500" viewBox="0 0 668 500" xmlns="http://www.w3.org/2000/svg"><line x1="32" y1="30" x2="32" y2="470" stroke="#2AA7CF" stroke-width="2" stroke-dasharray="5 5" /><g key="0"><circle cx="32" cy="30" r="20" fill="#202259" /><text x="32" y="36" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">1</text><rect x="70" y="0" width="586" height="62" rx="8" fill="#FFFFFF" stroke="#E3E6E8" stroke-width="1.5" /><text x="88" y="27" fill="#202259" font-size="18" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">浏览商品，点 Add to Cart</text><text x="88" y="49" fill="#5C646A" font-size="15" font-family="Inter, PingFang SC, sans-serif">products.html 卡片与商品详情页都有加购按钮</text></g><g key="1"><circle cx="32" cy="110" r="20" fill="#202259" /><text x="32" y="116" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">2</text><rect x="70" y="80" width="586" height="62" rx="8" fill="#FFFFFF" stroke="#E3E6E8" stroke-width="1.5" /><text x="88" y="107" fill="#202259" font-size="18" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">打开购物车，核对数量</text><text x="88" y="129" fill="#5C646A" font-size="15" font-family="Inter, PingFang SC, sans-serif">cart.html · 数量范围 1–99，可改可删</text></g><g key="2"><circle cx="32" cy="190" r="20" fill="#202259" /><text x="32" y="196" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter, PingFang SC, sans-serif">3</text><rect x="70" y="160" width="586" height="62" rx="8" fill="#FFFFFF" stroke="#E3E6E8" stroke-width="1.5" /><text x="88" y="187" fill="#202259" font-size="18" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">点 Proceed to checkout 进结算</text><text x="88" y="209" fill="#5C646A" font-size="15" font-family="Inter, PingFang SC, sans-serif">跳转 checkout.html?cart=1</text></g><g key="3"><circle cx="32" cy="270" r="20" fill="#202259" /><text x="32" y="27