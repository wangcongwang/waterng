<svg width="1132" height="208" viewBox="0 0 1132 208" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="372" height="30" rx="4" fill="rgba(32,34,89,0.08)" /><text x="12" y="21" fill="#202259" font-size="14" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">对比项</text><rect x="380" y="0" width="352" height="30" rx="4" fill="rgba(32,34,89,0.08)" /><text x="392" y="21" fill="#5C646A" font-size="14" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">未登录（访客）</text><rect x="740" y="0" width="392" height="30" rx="4" fill="#202259" /><text x="752" y="21" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Inter, PingFang SC, sans-serif">已登录（已有账户）</text><g key="0"><rect x="0" y="34" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="52" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">商品卡的 BV 标识</text><rect x="380" y="34" width="352" height="26" rx="4" fill="#FFFFFF" /><text x="392" y="52" fill="#859EB3" font-size="14" font-family="Inter, PingFang SC, sans-serif">不显示</text><rect x="740" y="34" width="392" height="26" rx="4" fill="#EAF6FD" /><text x="752" y="52" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">显示这件商品能得多少 BV</text></g><g key="1"><rect x="0" y="63" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="81" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">结算摘要的 BV 行</text><rect x="380" y="63" width="352" height="26" rx="4" fill="#FFFFFF" /><text x="392" y="81" fill="#859EB3" font-size="14" font-family="Inter, PingFang SC, sans-serif">整行不渲染</text><rect x="740" y="63" width="392" height="26" rx="4" fill="#EAF6FD" /><text x="752" y="81" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">显示 +N BV 奖励</text></g><g key="2"><rect x="0" y="92" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="110" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">已保存地址选择器</text><rect x="380" y="92" width="352" height="26" rx="4" fill="#FFFFFF" /><text x="392" y="110" fill="#859EB3" font-size="14" font-family="Inter, PingFang SC, sans-serif">整块隐藏</text><rect x="740" y="92" width="392" height="26" rx="4" fill="#EAF6FD" /><text x="752" y="110" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">可用，还可勾选保存新地址</text></g><g key="3"><rect x="0" y="121" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="139" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">Account Balance 支付</text><rect x="380" y="121" width="352" height="26" rx="4" fill="rgba(242,135,183,0.16)" /><text x="392" y="139" fill="#B3528A" font-size="14" font-family="Inter, PingFang SC, sans-serif">置灰禁用</text><rect x="740" y="121" width="392" height="26" rx="4" fill="rgba(42,167,207,0.16)" /><text x="752" y="139" fill="#1B6C88" font-size="14" font-family="Inter, PingFang SC, sans-serif">余额大于 0 时可选</text></g><g key="4"><rect x="0" y="150" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="168" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">下单后地址回写</text><rect x="380" y="150" width="352" height="26" rx="4" fill="#FFFFFF" /><text x="392" y="168" fill="#859EB3" font-size="14" font-family="Inter, PingFang SC, sans-serif">静默返回，不保存</text><rect x="740" y="150" width="392" height="26" rx="4" fill="#EAF6FD" /><text x="752" y="168" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">写入账户地址簿</text></g><g key="5"><rect x="0" y="179" width="372" height="26" rx="4" fill="#FFFFFF" /><text x="12" y="197" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">顶栏与侧边抽屉</text><rect x="380" y="179" width="352" height="26" rx="4" fill="#FFFFFF" /><text x="392" y="197" fill="#859EB3" font-size="14" font-family="Inter, PingFang SC, sans-serif">一个登录图标</text><rect x="740" y="179" width="392" height="26" rx="4" fill="#EAF6FD" /><text x="752" y="197" fill="#202259" font-size="14" font-family="Inter, PingFang SC, sans-serif">会员头像、会员 ID、退出按钮</text></g></svg>