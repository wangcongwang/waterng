  <script>
    function legalData(path) {
      let cur = window.T.trArray(path);
      if (cur && cur.length) return { title: window.T.tr(path + '.title'), sub: window.T.tr(path + '.sub'), updated: window.T.tr(path + '.updated'), sections: cur };
      const en = (window.I18N.en.legal || {})[path.split('.').pop()] || {};
      return { title: en.title || window.T.tr(path + '.title'), sub: en.sub || '', updated: en.updated || '', sections: en.sections || [] };
    }

    function applyI18nRefund() {
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = window.T.tr(el.dataset.i18n));

      const data = legalData('legal.refund');
      const host = document.getElementById('legalSections');
      const toc = document.getElementById('tocList');
      host.innerHTML = data.sections.map((s, i) => {
        const id = 'sec-' + (i + 1);
        return `
          <section id="${id}">
            <h2>${s.h2}</h2>
            ${(s.body || []).map(p => `<p>${p}</p>`).join('')}
          </section>
        `;
      }).join('');
      toc.innerHTML = data.sections.map((s, i) => {
        const id = 'sec-' + (i + 1);
        const label = s.h2.replace(/^\d+\.\s*/, '');
        return `<li><a href="#${id}">${label}</a></li>`;
      }).join('');
    }
    document.addEventListener('DOMContentLoaded', applyI18nRefund);
  </script>
