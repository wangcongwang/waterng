<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Member Upgrade · Elken</title>
  <meta name="description" content="Look up a member, view their profile, and adjust their rank. Only the level is editable." />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23202259' d='M12 3C8 9 6 12 6 15a6 6 0 0 0 12 0c0-3-2-6-6-12z'/></svg>" />

  <link rel="stylesheet" href="assets/css/elken-tokens.css">
  <link rel="stylesheet" href="assets/css/elken-base.css">
  <link rel="stylesheet" href="assets/css/elken-ui.css">
  <link rel="stylesheet" href="assets/css/elken-marketing.css">
  <link rel="stylesheet" href="assets/css/elken-chrome.css?v=20260909d">
  <link rel="stylesheet" href="assets/css/water-pages.css?v=20260908g">
  <link rel="stylesheet" href="assets/css/account-ui.css?v=20260909f">
  <script src="assets/js/elken-ui.js" defer></script>
</head>
<body data-page="member-upgrade">
  <div id="offline-banner" class="offline-banner">Connection status</div>
  <div id="app-header" class="ek-site-header"></div>

  <main class="page mug-shell">
    <div class="container">
      <div class="crumbs">
        <a href="index.html">Home</a> <span>›</span> <a href="account.html">My Account</a> <span>›</span> <span>Member Upgrade</span>
      </div>

      <div class="mug-card">
        <h1>Member Upgrade</h1>
        <p class="mug-intro">Look up a member by their ID to view basic profile information. Only the member level can be adjusted — the level can be set to <strong>Silver</strong> or <strong>Gold</strong>, all other fields are read-only. Save to apply the new level.</p>

        <!-- Section 1: Member ID search -->
        <div class="mug-field">
          <label for="memberIdInput">Member ID <span>*</span></label>
          <div>
            <input class="ek-input" type="text" id="memberIdInput" placeholder="NG + 8 digits" maxlength="10" autocomplete="off" />
            <button type="button" class="ek-btn--secondary" id="memberSearchBtn">Search</button>
          </div>
        </div>

        <div id="mugStatus" class="mug-status"></div>

        <!-- Section 2-4: Member fields (populated after search) -->
        <div id="mugFields" class="mug-fields">
          <!-- Member level (editable) — only Silver / Gold are valid upgrade targets -->
          <div class="mug-field is-editable">
            <label for="memberLevel">Member Level</label>
            <select class="ek-select" id="memberLevel" disabled>
              <option value="Silver">Silver</option>
              <option value="Gold">Gold</option>
            </select>
          </div>

          <!-- Member name (read-only) -->
          <div class="mug-field">
            <label>Member Name</label>
            <input class="ek-input" type="text" id="memberNameDisplay" readonly disabled />
          </div>

          <!-- Join date (read-only) -->
          <div class="mug-field">
            <label>Join Date</label>
            <input class="ek-input" type="text" id="memberJoinDateDisplay" readonly disabled />
          </div>
        </div>

        <!-- Actions -->
        <div class="mug-actions" id="mugActions">
          <button type="button" class="ek-btn--secondary" id="cancelBtn">Cancel</button>
          <button type="button" class="ek-btn--primary" id="saveBtn">Save level</button>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer" class="ek-site-footer"></div>

  <script src="assets/i18n/strings.js?v=20260909c"></script>
<script src="assets/js/app.js?v=20260909e"></script>
  <script src="assets/js/website.js?v=20260909c"></script>
  <script>
    /* ============================================================
       Member Upgrade page
       - Look up a member by ID
       - Display ID / Name / Join Date (read-only)
       - Allow adjusting Level only
       - Persist to localStorage and emit a local event so the
         account page can reflect the new level on next view.
       ============================================================ */
    (function () {
      'use strict';

      /* ---------- Tiny in-page directory of members (demo) ----------
         Each entry carries the basics shown to the user:
         name, level, joinDate. Real deployment would query the API.
         Level can be changed and persisted to al.memberLevels[]. */
      const DEMO_DIRECTORY = {
        'NG09246375': { name: 'Amara Okafor',        level: 'Silver',   joinDate: '2023-06-18' },
        'NG23374876': { name: 'Fauzia Yunus Shehu',    level: 'Gold',     joinDate: '2022-11-02' },
        'NG27187710': { name: 'Chinedu Okafor',        level: 'Platinum', joinDate: '2021-04-15' },
        'NG66051653': { name: 'Reporting Center',      level: 'Diamond',  joinDate: '2020-01-10' },
        'NG48655323': { name: 'Default Order Demo',    level: 'Silver',   joinDate: '2023-09-30' },
        'NG00000001': { name: 'Elken HQ',           level: 'Corporate',joinDate: '2019-08-01' },
      };

      /* Only Silver / Gold can be picked. The list is also the save-time whitelist:
         selecting anything else is rejected by doSave(). */
      const LEVELS = ['Silver', 'Gold'];

      /* ---------- Persistence ----------
         al.memberLevels = { [memberId]: 'Gold', ... } overrides demo values.
         al.memberProfiles = { [memberId]: { name, joinDate } } overrides too. */
      function getLevelOverrides() {
        try { return JSON.parse(localStorage.getItem('al.memberLevels') || '{}'); } catch { return {}; }
      }
      function getProfileOverrides() {
        try { return JSON.parse(localStorage.getItem('al.memberProfiles') || '{}'); } catch { return {}; }
      }
      function saveLevelOverride(id, level) {
        const all = getLevelOverrides();
        all[id] = level;
        localStorage.setItem('al.memberLevels', JSON.stringify(all));
      }

      /* ---------- Lookup: demo → overrides → stub ---------- */
      // Default join date so the read-only field is never shown as '—'.
      const DEFAULT_JOIN_DATE = '2024-01-01';
      function lookupMember(rawId) {
        const id = rawId.toUpperCase();
        const profile = getProfileOverrides()[id] || DEMO_DIRECTORY[id];
        const level = getLevelOverrides()[id] || (profile && profile.level) || 'Silver';
        if (!profile) return { id, _stub: true, name: 'Member ' + id.slice(-4), joinDate: DEFAULT_JOIN_DATE, level };
        return { id, name: profile.name, joinDate: profile.joinDate || DEFAULT_JOIN_DATE, level };
      }

      /* ---------- State ---------- */
      let current = null;          // { id, name, joinDate, level } — current loaded member
      let levelDirty = false;      // did user change the dropdown after load?
      const $ = id => document.getElementById(id);

      /* ---------- UI helpers ---------- */
      function setStatus(msg, kind) {
        const el = $('mugStatus');
        el.className = 'mug-status ' + (kind || 'info');
        el.textContent = msg;
        el.style.display = 'block';
      }
      function hideStatus() {
        const el = $('mugStatus');
        el.style.display = 'none';
        el.className = 'mug-status';
      }
      function formatJoinDate(raw) {
        if (!raw || raw === '—') return '—';
        // If the raw value looks like YYYY-MM-DD, format nicely.
        const m = String(raw).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (m) {
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
          if (!isNaN(dt)) {
            return `${dt.getUTCDate()} ${months[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
          }
        }
        return String(raw);
      }

      /* ---------- Load a member into the form ---------- */
      function loadMember(m) {
        current = { ...m };
        $('memberIdInput').value = m.id;
        $('memberNameDisplay').value = m.name || '—';
        $('memberJoinDateDisplay').value = formatJoinDate(m.joinDate);
        const sel = $('memberLevel');
        const lvl = (m.level || '').trim() || 'Silver';
        // Drop the transient "current level" option left over from a previous lookup, so the
        // list never grows beyond Silver / Gold (+ the loaded member's own level).
        Array.from(sel.querySelectorAll('option[data-transient]')).forEach(o => o.remove());
        if (LEVELS.indexOf(lvl) >= 0) sel.value = lvl;
        else {
          // Level outside the upgradeable set (legacy Bronze / Platinum / Diamond / Corporate):
          // show it as the member's current level so the field is never blank, but it is not a
          // selectable target — Save only accepts Silver / Gold.
          const opt = document.createElement('option');
          opt.value = lvl;
          opt.textContent = lvl + ' (current)';
          opt.dataset.transient = '1';
          sel.appendChild(opt);
          sel.value = lvl;
        }
        sel.disabled = false;
        $('mugFields').style.display = 'grid';
        $('mugActions').style.display = 'flex';
        levelDirty = false;
        $('saveBtn').disabled = true;
        setStatus('Member found. Level can be set to Silver or Gold.', 'info');
      }

      function clearMember() {
        current = null;
        $('mugFields').style.display = 'none';
        $('mugActions').style.display = 'none';
        $('memberNameDisplay').value = '';
        $('memberJoinDateDisplay').value = '';
        // Drop any transient "current level" option so the list is Silver / Gold again.
        const sel = $('memberLevel');
        Array.from(sel.querySelectorAll('option[data-transient]')).forEach(o => o.remove());
        sel.value = 'Silver';
        sel.disabled = true;
        levelDirty = false;
      }

      /* ---------- Search ---------- */
      function doSearch() {
        const raw = ($('memberIdInput').value || '').trim();
        if (!/^NG\d{8}$/i.test(raw)) {
          setStatus('Invalid member ID — format must be NG + 8 digits.', 'error');
          clearMember();
          return;
        }
        const m = lookupMember(raw);
        loadMember(m);
      }

      /* ---------- Save ---------- */
      function doSave() {
        if (!current) return;
        const newLevel = $('memberLevel').value;
        if (LEVELS.indexOf(newLevel) < 0) {
          setStatus('Invalid level selected.', 'error');
          return;
        }
        saveLevelOverride(current.id, newLevel);
        current.level = newLevel;
        levelDirty = false;
        $('saveBtn').disabled = true;
        setStatus(`✓ Level updated to ${newLevel}. The change is effective immediately.`, 'success');

        // notify other tabs / pages (e.g. account.html) so they re-read the override
        try {
          window.dispatchEvent(new CustomEvent('al:member-level-changed', {
            detail: { memberId: current.id, level: newLevel }
          }));
        } catch {}
        try { localStorage.setItem('al.memberLevels:ping', String(Date.now())); } catch {}
      }

      /* ---------- Init ---------- */
      function init() {
        const input = $('memberIdInput');
        input.addEventListener('input', () => { input.value = input.value.toUpperCase(); });
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

        $('memberSearchBtn').addEventListener('click', doSearch);
        $('saveBtn').addEventListener('click', doSave);
        $('cancelBtn').addEventListener('click', () => {
          clearMember();
          hideStatus();
          $('memberIdInput').value = '';
          $('memberIdInput').focus();
        });

        // dirty-tracking on the level select — only enabled when a member is loaded
        $('memberLevel').addEventListener('change', () => {
          if (!current) return;
          levelDirty = $('memberLevel').value !== current.level;
          $('saveBtn').disabled = !levelDirty;
        });

        // If the URL has ?id=NGxxxxxxxx, pre-load that member
        try {
          const qp = new URLSearchParams(location.search).get('id');
          if (qp && /^NG\d{8}$/i.test(qp)) {
            $('memberIdInput').value = qp.toUpperCase();
            doSearch();
          }
        } catch {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
