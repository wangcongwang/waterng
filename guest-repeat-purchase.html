<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shop Elken Products · Elken</title>
  <meta name="description" content="Browse and buy Elken products without signing in." />
  <link rel="stylesheet" href="assets/css/elken-tokens.css">
  <link rel="stylesheet" href="assets/css/elken-base.css">
  <link rel="stylesheet" href="assets/css/elken-ui.css?v=20260919a">
  <link rel="stylesheet" href="assets/css/elken-marketing.css">
  <link rel="stylesheet" href="assets/css/elken-pages.css?v=20260917a">
  <link rel="stylesheet" href="assets/css/elken-chrome.css?v=20260909d">
  <link rel="stylesheet" href="assets/css/water-pages.css?v=20260915c">
  <link rel="stylesheet" href="assets/css/repeat-purchase.css?v=20260922b">
  <script src="assets/js/elken-ui.js?v=20260909c" defer></script>
</head>
<body data-page="repeat-purchase" data-guest-no-nav="true" data-env="ae">
  <div id="app-header" class="ek-site-header"></div>

  <main id="main">
    <section class="sec-banner sec-banner--gradient sec-banner--short">
      <div class="sec-banner__glow" aria-hidden="true"></div>
      <div class="sec-banner__inner">
        <div class="sec-banner__crumb"><nav class="ek-breadcrumb" aria-label="Breadcrumb"><a href="login.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Shop</span></nav></div>
        <div class="sec-banner__copy">
          <!-- Market name injected by the inline script below ("UAE"/"Nigeria") -->
          <h1 class="ek-h1">Shop <span class="t-accent">Elken <span id="rpMarketName"></span>.</span></h1>
          <p class="sec-banner__sub">No account needed — browse, add to cart and check out as a guest.</p>
        </div>
      </div>
    </section>

    <section class="sec-pad rp-section">
      <div class="ek-container">
        <div class="rp-sechead">
          <h2 class="rp-sechead__title">Also in this range</h2>
          <p class="rp-sechead__sub">Guest checkout available on every item below.</p>
        </div>
        <div class="rp-product-grid" id="rpProductGrid" aria-live="polite">
          <!-- Rendered by JS -->
        </div>
        <p class="rp-guest-note">
          Want member pricing and BV rewards?
          <a href="signup.html?next=repeat-purchase.html">Create an account</a>
        </p>
      </div>
    </section>
  </main>

  <div id="app-footer" class="ek-site-footer"></div>

  <!-- Register interest modal -->
  <dialog class="ek-modal" id="interestModal" aria-labelledby="interestTitle">
    <div class="ek-modal__head">
      <h3 class="ek-modal__title" id="interestTitle">Register interest</h3>
      <button type="button" class="modal-close" id="interestModalClose" aria-label="Close">&times;</button>
    </div>
    <div class="ek-modal__body">
      <p class="ek-text" id="interestProductName"></p>
      <form class="ek-form" id="interestForm" novalidate>
        <label class="ek-field">
          <span class="ek-field__label">Full name</span>
          <input class="ek-input" type="text" id="interestName" required placeholder="Your name">
        </label>
        <label class="ek-field">
          <span class="ek-field__label">Email</span>
          <input class="ek-input" type="email" id="interestEmail" required placeholder="you@example.com">
        </label>
        <label class="ek-field">
          <span class="ek-field__label">Phone number</span>
          <input class="ek-input" type="tel" id="interestPhone" placeholder="+234 000 000 0000">
        </label>
      </form>
    </div>
    <div class="ek-modal__foot">
      <button type="button" class="ek-btn ek-btn--ghost" id="interestCancel">Cancel</button>
      <button type="submit" class="ek-btn ek-btn--primary" form="interestForm">Submit interest</button>
    </div>
  </dialog>

  <!-- Product detail modal (guest: retail price only, no DP/member price) -->
  <div class="pv-overlay" id="prodViewModal" style="display:none" role="dialog" aria-modal="true" aria-label="Product details">
    <div class="pv-dialog">
      <div class="pv-dialog__topbar">
        <span class="pv-dialog__code" id="pvCode"></span>
        <button type="button" class="pv-dialog__close" id="pvClose" aria-label="Close">&times;</button>
      </div>
      <div class="pv-dialog__body">
        <div class="pv-dialog__media" id="pvMedia"></div>
        <div class="pv-dialog__info">
          <h3 class="pv-dialog__name" id="pvName"></h3>
          <dl class="pv-spec">
            <div class="pv-spec__row"><dt>Product Code</dt><dd id="pvSku"></dd></div>
            <div class="pv-spec__row"><dt>Retail Price</dt><dd id="pvPrice"></dd></div>
            <div class="pv-spec__row"><dt>Tax Rate</dt><dd id="pvTaxRate"></dd></div>
            <div class="pv-spec__row"><dt>Tax</dt><dd id="pvTax"></dd></div>
            <div class="pv-spec__row"><dt>Inventory</dt><dd id="pvStock"></dd></div>
          </dl>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/i18n/strings.js?v=20261021id"></script>
  <script src="assets/js/app.js?v=20261021id"></script>
  <script src="assets/js/website.js?v=20261021id"></script>
<script src="assets/js/cart-fab.js?v=20261012a" defer></script>
  <script>
    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        const grid = document.getElementById('rpProductGrid');
        // Guest market: picked in the login page's chooser (sessionStorage),
        // with the URL param as the fallback for direct links. Drives the
        // catalogue, the currency on every card, and — via the order record —
        // which house account owns the order (NG000000001 / AE000000001).
        const guestCountry = (function () {
          try {
            const s = sessionStorage.getItem('al.guestCountry');
            if (s) return s;
          } catch (e) {}
          const p = new URLSearchParams(window.location.search).get('country');
          return p || 'Nigeria';
        })();
        const pc = window.ProductCatalog || {};
        // Annotate the banner heading (and tab title) with the chosen market —
        // "Shop Elken UAE." / "Shop Elken Nigeria." — so the guest always sees
        // which market's catalogue and currency they are browsing.
        const marketDisplay = (pc.normalizeCountryName ? pc.normalizeCountryName(guestCountry) : guestCountry) || guestCountry;
        const marketEl = document.getElementById('rpMarketName');
        if (marketEl) marketEl.textContent = marketDisplay;
        document.title = 'Shop Elken ' + marketDisplay + ' Products · Elken';
        const catalog = pc.getProductsByCountry ? pc.getProductsByCountry(guestCountry) : (pc.allProducts || []);
        if (pc.renderRepeatCards) {
          pc.renderRepeatCards(grid, catalog, { country: guestCountry, modalView: true });
        }

        // Product-detail modal: guests see the retail price only (no DP).
        const pvModal = document.getElementById('prodViewModal');
        const pvClose = document.getElementById('pvClose');
        function guestMoney(n, dp) {
          if (pc.formatMoney) return pc.formatMoney(n, guestCountry, dp);
          return 'N' + Number(n || 0).toLocaleString();
        }
        window.__guestProductView = function (product) {
          if (!pvModal || !product) return;
          const retail = product.rp || product.price;
          const cfg = pc.getCountryConfig ? pc.getCountryConfig(guestCountry) : null;
          const rate = (cfg && typeof cfg.taxRate === 'number') ? cfg.taxRate : 0.075;
          const tax = retail * rate / (1 + rate); // VAT-inclusive
          document.getElementById('pvCode').textContent = product.sku || '—';
          document.getElementById('pvName').textContent = product.name;
          document.getElementById('pvSku').textContent = product.sku || '—';
          document.getElementById('pvPrice').textContent = guestMoney(retail);
          document.getElementById('pvTaxRate').textContent = (rate * 100) + '%';
          document.getElementById('pvTax').textContent = guestMoney(tax, 2);
          document.getElementById('pvStock').textContent = String(product.stock ?? 0);
          const media = document.getElementById('pvMedia');
          media.innerHTML = product.img
            ? `<img src="assets/img/products/${product.category || ''}/${product.img}" alt="${product.name}" onerror="this.style.display='none'" />`
            : '';
          pvModal.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        };
        function closePvModal() {
          if (!pvModal) return;
          pvModal.style.display = 'none';
          document.body.style.overflow = '';
        }
        if (pvClose) pvClose.addEventListener('click', closePvModal);
        if (pvModal) {
          pvModal.addEventListener('click', e => { if (e.target === pvModal) closePvModal(); });
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePvModal(); });

        // Wire register-interest modal
        const modal = document.getElementById('interestModal');
        const closeBtn = document.getElementById('interestModalClose');
        const cancelBtn = document.getElementById('interestCancel');
        const form = document.getElementById('interestForm');
        const productNameEl = document.getElementById('interestProductName');
        let currentProduct = null;

        function openModal(product) {
          currentProduct = product;
          productNameEl.textContent = `Let me know when ${product.name} is available.`;
          form.reset();
          modal.showModal();
        }

        function closeModal() {
          modal.close();
          currentProduct = null;
        }

        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal();
        });

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!currentProduct) return;
          const payload = {
            productId: currentProduct.id,
            productName: currentProduct.name,
            name: document.getElementById('interestName').value.trim(),
            email: document.getElementById('interestEmail').value.trim(),
            phone: document.getElementById('interestPhone').value.trim(),
            date: Date.now(),
          };
          const key = 'al.interests';
          const list = JSON.parse(localStorage.getItem(key) || '[]');
          list.unshift(payload);
          localStorage.setItem(key, JSON.stringify(list));
          if (window.toast) window.toast(`Interest registered for ${currentProduct.name}.`, 'success');
          closeModal();
        });
      });
    })();
  </script>
</body>
</html>
