<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your Cart · Elken</title>
  <meta name="description" content="Review the items in your Elken shopping cart and proceed to secure checkout." />
  <link rel="stylesheet" href="assets/css/elken-tokens.css">
  <link rel="stylesheet" href="assets/css/elken-base.css">
  <link rel="stylesheet" href="assets/css/elken-ui.css?v=20260919a">
  <link rel="stylesheet" href="assets/css/elken-marketing.css">
  <link rel="stylesheet" href="assets/css/elken-chrome.css?v=20260909d">
  <link rel="stylesheet" href="assets/css/water-pages.css?v=20260915c">
  <link rel="stylesheet" href="assets/css/cart.css?v=20261012a">
  <script src="assets/js/elken-ui.js" defer></script>
</head>
<body data-page="cart" data-guest-no-nav="true">
  <div id="offline-banner" class="offline-banner">Connection status</div>
  <div id="app-header" class="ek-site-header"></div>

  <main class="site-main">
    <section class="site-section cart-page">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow eyebrow-ink">Shopping</p>
          <h1>Your Cart</h1>
          <p class="section-sub">Review your items, adjust quantities, then proceed to checkout.</p>
        </header>

        <div id="cartView">
          <!-- Filled by JS: either the cart list or the empty state -->
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer" class="ek-site-footer"></div>
  <script src="assets/i18n/strings.js?v=20261021id"></script>
<script src="assets/js/app.js?v=20261021id"></script>
  <script src="assets/js/website.js?v=20261021id"></script>
  <script>
    (function() {
      'use strict';
      // Cart money follows the order market. Guest flow (login page's
      // "Shop now") wins — the tab explicitly chose to shop without an
      // account, so the market picked in the chooser applies (sessionStorage
      // al.guestCountry, URL param as fallback). Otherwise the signed-in
      // member's own market.
      const cartCountry = (function () {
        const pc = window.ProductCatalog || {};
        try {
          if (sessionStorage.getItem('al.guestMode') === '1') {
            const g = sessionStorage.getItem('al.guestCountry');
            if (g) return g;
            const gp = new URLSearchParams(location.search).get('country');
            if (gp) return gp;
          }
        } catch (e) {}
        const u = (window.Auth && window.Auth.user) || {};
        let md = {};
        try { md = JSON.parse(localStorage.getItem('al.memberData') || '{}'); } catch (e) {}
        if (u.memberId || md.memberId) {
          for (const c of [md.country, md._defaultCountry, u.country]) {
            const n = pc.normalizeCountryName ? pc.normalizeCountryName(c) : '';
            if (n) return n;
          }
          const fromId = pc.countryFromMemberId ? pc.countryFromMemberId(u.memberId || md.memberId || '') : '';
          if (fromId) return fromId;
        }
        return 'Nigeria';
      })();
      const N = n => (window.ProductCatalog && window.ProductCatalog.formatMoney)
        ? window.ProductCatalog.formatMoney(n, cartCountry)
        : ('N' + Number(n || 0).toLocaleString());

      function imgOf(item) {
        if (item.img) {
          // "Add to cart" buttons on some marketing pages set data-img to a
          // full path (assets/img/prod-x.png) rather than a bare filename —
          // prepending the category folder to that mangles it into a
          // nonexistent nested path. Only prepend when img is actually bare.
          if (/^(assets\/|https?:)/i.test(item.img)) return item.img;
          return item.category ? `assets/img/products/${item.category}/${item.img}` : item.img;
        }
        return 'assets/img/categories/health-wellness.webp';
      }

      function render() {
        const view = document.getElementById('cartView');
        if (!view) return;
        // Member repeat-purchase uses an independent cart (al.memberCart).
        const memberMode = new URLSearchParams(location.search).get('mode') === 'member';
        if (memberMode) {
          document.body.setAttribute('data-cart-mode', 'member');
          document.title = 'Member Cart · Elken';
        }
        const pc = window.ProductCatalog || {};
        const getCartFn = memberMode ? pc.getMemberCart : pc.getCart;
        const cart = (getCartFn ? getCartFn() : []);
        const store = {
          updateQty: memberMode ? pc.updateMemberCartQty : pc.updateCartQty,
          remove: memberMode ? pc.removeFromMemberCart : pc.removeFromCart,
          clear: memberMode ? pc.clearMemberCart : pc.clearCart,
        };

        // "Browse products" (empty state) and "Continue shopping" return to the
        // matching shop. Member pages carry a `from` param so the operator lands
        // back on the exact originating flow (restore=1 keeps the searched
        // member & their cart intact); guests fall back to the guest copy.
        const guestMode = (() => {
          try { return sessionStorage.getItem('al.guestMode') === '1'; } catch (e) { return false; }
        })();
        const loggedIn = !!(window.Auth && window.Auth.isLoggedIn && window.Auth.isLoggedIn());
        let continueHref;
        if (memberMode) {
          const from = new URLSearchParams(location.search).get('from');
          continueHref = (from ? from + '.html' : 'member-repurchase.html') + '?restore=1';
        } else if (guestMode) {
          continueHref = 'guest-repeat-purchase.html?guest=1';
        } else {
          continueHref = 'repeat-purchase.html';
        }
        const checkoutHref = memberMode ? 'checkout.html?cart=1&mode=member' : 'checkout.html?cart=1';

        if (!cart.length) {
          view.innerHTML = `
            <div class="cart-empty">
              <div class="cart-empty-icon">🛒</div>
              <h2>${memberMode ? 'This member cart is empty' : 'Your cart is empty'}</h2>
              <p>${memberMode ? 'Search a member and add products to start their repeat-purchase order.' : 'Add products you love and they will appear here.'}</p>
              <a class="ek-btn ek-btn--primary" href="${continueHref}">Browse products</a>
            </div>`;
          return;
        }

        const lines = cart.map(item => {
          const qty = item.qty || 1;
          const lineTotal = (item.price || 0) * qty;
          return `
            <div class="cart-item" data-id="${item.id}">
              <div class="cart-item-img"><img src="${imgOf(item)}" alt="${item.name}" loading="lazy" /></div>
              <div class="cart-item-body">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-unit">${N(item.price)} each</div>
                <button type="button" class="cart-item-remove" data-remove="${item.id}">Remove</button>
              </div>
              <div class="cart-item-qty">
                <div class="qty-control">
                  <button type="button" class="qty-btn" data-dec="${item.id}" aria-label="Decrease">−</button>
                  <input type="number" class="cartQty" data-id="${item.id}" value="${qty}" min="1" max="99" inputmode="numeric" aria-label="Quantity" />
                  <button type="button" class="qty-btn" data-inc="${item.id}" aria-label="Increase">+</button>
                </div>
              </div>
              <div class="cart-item-line">${N(lineTotal)}</div>
            </div>`;
        }).join('');

        const subtotal = cart.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);
        const count = cart.reduce((s, i) => s + (i.qty || 1), 0);

        // BV total — looked up from the catalogue by product id so it never
        // drifts from the product cards. Member-flow rules below need it even
        // when the operator isn't "loggedIn" in the shopper sense.
        let totalBV = 0;
        if (pc.allProducts) {
          const catalog = pc.allProducts;
          cart.forEach(item => {
            const matched = catalog.find(p => p.id === item.id);
            const bv = (matched && typeof matched.bv === 'number') ? matched.bv
                     : (typeof item.bv === 'number' ? item.bv : 0);
            totalBV += bv * (item.qty || 1);
          });
        }

        // Member-flow rules: auto-maintenance requires BV ≥ 90; upgrade requires
        // BV ≥ the chosen target-level difference. Both block checkout here, in
        // the cart, before the operator ever reaches the checkout page.
        let flowHtml = '';
        let blocked = false;
        let blockNote = '';
        if (memberMode) {
          const rm = (() => { try { return JSON.parse(localStorage.getItem('al.repeatMember') || '{}'); } catch (e) { return {}; } })();
          const subtype = rm.subtype;
          if (subtype === 'auto-maintenance') {
            const ok = totalBV >= 90;
            blocked = !ok;
            blockNote = ok ? '' : 'Add more products — Auto-Maintenance needs at least 90 BV.';
            flowHtml = `
              <div class="cart-flow${ok ? ' cart-flow--ok' : ' cart-flow--err'}">
                <h3>Auto-Maintenance requirement</h3>
                <div class="row"><span class="k">Current BV</span><span class="v">${totalBV} BV</span></div>
                <div class="row"><span class="k">Requirement</span><span class="v">${ok ? totalBV + ' / 90 BV ✓' : totalBV + ' / 90 BV ✕'}</span></div>
              </div>`;
          } else if (subtype === 'upgrade') {
            const LEVEL_BV = { Member: 0, Silver: 30, Gold: 250, Platinum: 2700, Diamond: 8100, Corporate: 24300 };
            const bvOf = l => (typeof LEVEL_BV[l] === 'number' ? LEVEL_BV[l] : 0);
            const current = rm.level || 'Member';
            const options = ['Silver', 'Gold'].filter(l => bvOf(l) > bvOf(current));
            const storedTarget = (typeof rm.targetLevel === 'string') ? rm.targetLevel : '';
            const selVal = options.indexOf(storedTarget) !== -1 ? storedTarget : '';
            const diff = selVal ? Math.max(0, bvOf(selVal) - bvOf(current)) : 0;
            if (!selVal) {
              blocked = true;
              blockNote = 'Choose an upgrade level to continue.';
            } else if (totalBV < diff) {
              blocked = true;
              blockNote = `Cart BV (${totalBV}) must be ≥ ${diff} BV to upgrade to ${selVal}.`;
            }
            const opts = options.map(l => `<option value="${l}"${l === selVal ? ' selected' : ''}>${l}</option>`).join('');
            flowHtml = `
              <div class="cart-flow${blocked ? ' cart-flow--err' : ' cart-flow--ok'}">
                <h3>Upgrade member</h3>
                <p class="cart-flow__hint">Current level: <strong>${current}</strong>. Choose the level to upgrade to — cart BV must cover the difference.</p>
                <div class="field">
                  <label for="cartUpgradeTo">Upgrade to <span class="req">*</span></label>
                  <select class="ek-select" id="cartUpgradeTo">${opts ? '<option value="">— Select level —</option>' + opts : '<option value="">No higher level available</option>'}</select>
                </div>
                ${selVal ? `<div class="row"><span class="k">Upgrade difference</span><span class="v">${diff} BV</span></div>` : ''}
                <div class="row"><span class="k">Current BV</span><span class="v">${totalBV} BV</span></div>
              </div>`;
          }
        }

        const checkoutBtn = blocked
          ? `<button type="button" class="ek-btn ek-btn--primary ek-btn--block ek-btn--lg" disabled style="opacity:.45;cursor:not-allowed">Proceed to checkout</button>`
          : `<a class="ek-btn ek-btn--primary ek-btn--block ek-btn--lg" href="${checkoutHref}">Proceed to checkout</a>`;

        view.innerHTML = `
          <div class="cart-layout">
            <div class="cart-list">${lines}</div>
            <div class="cart-side">
              <div class="cart-summary">
                <h2>Order summary</h2>
                <div class="row"><span class="k">Items</span><span class="v">${count}</span></div>
                <div class="row"><span class="k">Subtotal</span><span class="v">${N(subtotal)}</span></div>
                <div class="row"><span class="k">Shipping</span><span class="v">Calculated at checkout</span></div>
                ${(memberMode || (!guestMode && totalBV > 0)) ? `<div class="row"><span class="k">Total BV</span><span class="v">${totalBV} BV</span></div>` : ''}
                <div class="total"><span class="k">Total</span><span class="v" id="cartTotal">${N(subtotal)}</span></div>
                ${flowHtml}
                ${blocked ? `<p class="cart-block-note" style="color:var(--ek-error, #c0392b);font-size:13px;margin:10px 0 0">⚠ ${blockNote}</p>` : ''}
                ${checkoutBtn}
                <button type="button" class="ek-btn ek-btn--ghost ek-btn--block" id="clearCart">Clear cart</button>
                <a class="ek-btn ek-btn--secondary ek-btn--block" href="${continueHref}">Continue shopping</a>
              </div>
            </div>
          </div>`;

        // Upgrade target selection in the cart persists to al.repeatMember so the
        // checkout page can pre-select it and re-validate the exact difference.
        const flowSel = document.getElementById('cartUpgradeTo');
        if (flowSel) flowSel.addEventListener('change', () => {
          const rm = (() => { try { return JSON.parse(localStorage.getItem('al.repeatMember') || '{}'); } catch (e) { return {}; } })();
          rm.targetLevel = flowSel.value;
          try { localStorage.setItem('al.repeatMember', JSON.stringify(rm)); } catch (e) {}
          render();
        });

        // Quantity controls
        view.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.inc;
          const input = view.querySelector(`.cartQty[data-id="${id}"]`);
          input.value = Math.min(99, (parseInt(input.value, 10) || 1) + 1);
          if (store.updateQty) store.updateQty(id, input.value);
        }));
        view.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.dec;
          const input = view.querySelector(`.cartQty[data-id="${id}"]`);
          input.value = Math.max(1, (parseInt(input.value, 10) || 1) - 1);
          if (store.updateQty) store.updateQty(id, input.value);
        }));
        view.querySelectorAll('.cartQty').forEach(input => input.addEventListener('input', () => {
          if (store.updateQty) store.updateQty(input.dataset.id, input.value);
        }));
        view.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
          if (store.remove) store.remove(b.dataset.remove);
        }));
        const clearBtn = document.getElementById('clearCart');
        if (clearBtn) clearBtn.addEventListener('click', () => {
          if (store.clear) store.clear();
        });
      }

      document.addEventListener('DOMContentLoaded', render);
      window.addEventListener('al:cartchange', render);
      window.addEventListener('al:authchange', render);
    })();
  </script>
</body>
</html>
