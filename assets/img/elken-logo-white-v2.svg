<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 576 120.17">
  <!-- Elken reversed lockup for dark grounds. Official 2023 artwork
       (New-Elken-logo-2023-White.svg), unaltered geometry, viewBox 576 x 120.17.
       The only change: the registered mark was #0a1a5c in the source, which is not
       Elken's brand blue (#202259) and rendered as a near-invisible dark speck on a
       navy ground. It is white here, like the rest of the lockup.
       The emblem is a single path with the flower knocked out, so any background
       shows through it. Do not add a fill to it.
       深色底反白标志。沿用 2023 年官方原始图形，未改动几何比例。
       仅把注册商标符号从 #0a1a5c 改为白色（原色既非品牌蓝，在深蓝底上也几乎看不见）。
       花形是镂空的，任何底色都会透出来，不要给它加填充色。 -->
  <defs>
    <style>
      .st0 {
        fill: #fff;
      }

      .st1 {
        fill: #fff;
      }
    </style>
  </defs>
